# S6 -- Feature-space typicality. Negative Mahalanobis distance (Ledoit-Wolf
# shrunk covariance) from the CLIP embedding to 3000 defect-free SDNET2018
# train images (excluding the tuning set). High = typical clean surface;
# defects AND unfamiliar scenes score low -- the shift-aware candidate.
# See src/certus/scores/s6.py and the localized-CP method (3.2.4).
id: s6
name: feature_typicality
params:
  metric: mahalanobis
  reference: sdnet2018 train, uncracked, n=3000, minus tuning set
