# S5 -- MC-dropout dispersion. CLIP has no dropout layers, so K=20 passes of
# dropout (p=0.1) go on the image embedding before S1's zero-shot head.
# Oriented as a lower confidence bound on "clean": mean(1-p) - std(1-p), so
# an image is cleared only if it looks clean AND stays so under dropout.
# Masks are seeded per image (relpath). See src/certus/scores/s5.py.
id: s5
name: mc_dropout_dispersion
params:
  k_passes: 20
  dropout: 0.1
