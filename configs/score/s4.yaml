# S4 -- Detector objectness. 1 - max confidence over predicted defect boxes.
# No trained detector exists, so the boxes come from OWLv2 zero-shot
# (google/owlv2-base-patch16-ensemble), one text query per defect class;
# the queries live in src/certus/scores/s4.py. Strong on localised defects,
# weak on diffuse ones such as damp patches. See roadmap 3.3.
id: s4
name: detector_objectness
model: google/owlv2-base-patch16-ensemble
params: {}
