# Conformal risk control -- the primary method (roadmap 3.2.2). Bounds
# E[L_test(lambda_hat)] <= epsilon for the asymmetric missed-defect loss,
# not marginal coverage. Scores are oriented high = little defect evidence,
# so an image is AUTO_CLEARed iff s(x) > lambda (see src/certus/conformal/crc.py).
method: crc
epsilon: 0.02
loss: missed_defect  # L_i(lambda) = 1{y_i = defect and s(x_i) > lambda}
guarantee: conditional  # joint: E[1{defect and cleared}] <= eps
                        # conditional: P(cleared | defect) <= eps (calibrate on positives)
