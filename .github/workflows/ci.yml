name: CI

on:
  push:
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: ruff lint
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy src/certus

      - name: pytest
        run: pytest -v

      - name: nbstripout check
        run: |
          files=$(git ls-files '*.ipynb')
          if [ -n "$files" ]; then nbstripout --verify $files; fi
