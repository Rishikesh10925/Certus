[project]
name = "certus"
version = "0.1.0"
description = "Distribution-free risk guarantees for automated visual inspection via conformal risk control."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Rayyan Mohammed" }]

dependencies = [
    "numpy==1.26.4",
    "scipy==1.12.0",
    "pandas==2.2.1",
    "pillow==10.2.0",
    "torch==2.2.1",
    "transformers==4.38.2",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "fastapi==0.110.0",
    "uvicorn[standard]==0.27.1",
    "pydantic==2.6.3",
    "scikit-learn==1.4.1.post1",
    "dvc==3.44.0",
    "pathspec==0.11.2",  # dvc 3.44.0 breaks on pathspec>=1.0 (removed _DIR_MARK)
    "wandb==0.16.3",
    "matplotlib==3.8.3",
    "seaborn==0.13.2",
    "sqlmodel==0.0.16",
    "tqdm==4.66.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.2.2",
    "mypy==1.8.0",
    "pytest==8.0.2",
    "pytest-cov==4.1.0",
    "pre-commit==3.6.2",
    "nbstripout==0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/certus"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["notebooks/", "paper/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
